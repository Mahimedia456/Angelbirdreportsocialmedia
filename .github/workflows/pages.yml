name: Angelbird Reports Website
# GitHub Pages must first be enabled in repository Settings > Pages.
# Vercel remains the primary published website; this optional deployment is manual.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate archive website
        run: python scripts/build_website.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
