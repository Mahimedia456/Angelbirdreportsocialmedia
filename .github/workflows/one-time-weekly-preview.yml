name: One-time weekly PDF preview 24-30 Oct 2026
on:
  push:
    branches: [main]
    paths:
      - 'config/weekly_preview_2026_10_30.run'
permissions:
  contents: write
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate weekly PDF from saved evidence without external API calls
        run: python -m scripts.build_weekly_preview
      - name: Validate weekly PDF readability, pages and content
        run: |
          python -m pip install pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          pdfs=list(Path("reports/2026/10").glob("*-Weekly-2026-10-24_to_2026-10-30.pdf"))
          assert len(pdfs)==1, f"Expected one weekly PDF: {pdfs}"
          pdf=pdfs[0]
          with pdf.open("rb") as f: assert f.read(5)==b"%PDF-"
          reader=PdfReader(str(pdf),strict=True)
          pages=len(reader.pages)
          assert pages >= 1
          extracted=" ".join((p.extract_text() or "") for p in reader.pages)
          assert "YOUTUBE" in extracted.upper(), "YouTube section was not rendered"
          assert "WEEKLY" in extracted.upper()
          assert len(extracted)>1000, f"Report text unexpectedly short: {len(extracted)}"
          print(f"VALID PDF: {pdf}, pages={pages}, bytes={pdf.stat().st_size}, text_chars={len(extracted)}")
          PY
      - name: Save weekly PDF and manifest without altering daily indexes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/2026/10/*-Weekly-2026-10-24_to_2026-10-30.pdf weekly-reports-index.json
          git diff --cached --quiet || (git commit -m 'Publish one-time weekly social monitoring PDF 24-30 Oct' && git pull --rebase origin main && git push origin main)
