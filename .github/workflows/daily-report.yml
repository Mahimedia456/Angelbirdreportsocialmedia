name: Angelbird Daily Social Monitoring
on:
  schedule:
    - cron: '0 14 * * *' # UTC; 19:00 Pakistan time, reports today's partial-day snapshot
  workflow_dispatch:
    inputs:
      report_date:
        description: 'YYYY-MM-DD (blank: today in Pakistan)'
        required: false
        type: string
      dry_run:
        description: 'Generate a demonstration PDF without paid API calls'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
concurrency:
  group: angelbird-report-main
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      RESEARCH_ENGINE: 'python'
      FREE_SOURCES_ONLY: 'false'
      GPT_RESEARCH_ENABLED: 'true'
      GPT_PLATFORM_SWEEPS: 'true'
      GPT_MAX_RESEARCH_ROUNDS: '3'
      GPT_FORCE_RESEARCH: 'false'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: 'gpt-4.1-mini'
      GPT_MAX_WEB_CALLS: '2'
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_MAX_COMMENT_VIDEOS: '6'
      MAX_SEARCH_QUERIES: '28'
      MAX_SOURCE_PAGES: '48'
      MAX_SOURCE_PAGES_PER_GROUP: '7'
      MAX_SOURCE_IMAGES: '12'
      MAX_REPORT_IMAGES: '10'
      REPORT_SINGLE_DAY: 'true'
      REPORT_DATE: ${{ inputs.report_date }}
      REPORT_PREVIOUS_COMPLETED_DAY: 'false'
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Validate and test
        run: python -m unittest discover -s tests -v
      - name: Scheduled platform research, source verification, posts, images and PDF
        run: python -m src.main
      - name: Verify source URLs and platform-to-post PDF evidence
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          DAY="${REPORT_DATE:-$(TZ=Asia/Karachi date +%F)}"
          python -m src.verify_pdf "$DAY"
      - name: Refresh public website reports index
        run: python scripts/update_report_index.py
      - name: Save dated reports to GitHub
        if: success()
        run: |
          git config user.name 'angelbird-report-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ data/ assets/ reports-index.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Angelbird daily monitoring ${REPORT_DATE:-PKT-today}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
      - name: Preserve diagnostics if run fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: angelbird-failed-run
          path: |
            data/
            reports/
            assets/
          if-no-files-found: ignore
