name: Angelbird Hybrid GPT + YouTube | 30 Oct
on:
  push:
    branches: [main]
    paths:
      - 'config/hybrid_2026_10_30.run'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: angelbird-report-main
  cancel-in-progress: false
jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      REPORT_DATE: '2026-10-30'
      DRY_RUN: 'false'
      REPORT_ONLY: 'false'
      RESEARCH_ENGINE: 'python'
      GPT_RESEARCH_ENABLED: 'true'
      GPT_MAX_WEB_CALLS: '2'
      OPENAI_MODEL: 'gpt-4.1-mini'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YT_MAX_COMMENT_VIDEOS: '6'
      MAX_SEARCH_QUERIES: '18'
      MAX_SOURCE_PAGES: '25'
      MAX_REPORT_IMAGES: '6'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify bounded GPT and source tests
        run: python -m unittest discover -s tests -v
      - name: Perform single paid GPT research supplement + free sources and PDF
        run: python -m src.main
      - name: Persist report, paid usage audit and cached evidence
        if: always()
        run: |
          git config user.name 'angelbird-report-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ data/ assets/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'Angelbird hybrid 30 Oct GPT + YouTube research and evidence'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
      - name: Save run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelbird-hybrid-30-oct
          path: |
            data/2026/10/
            reports/2026/10/
            assets/2026/10/
          if-no-files-found: ignore
