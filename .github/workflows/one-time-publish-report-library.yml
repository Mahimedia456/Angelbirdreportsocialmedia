name: Publish Angelbird Daily Weekly Monthly Library
on:
  push:
    branches: [main]
    paths: ['config/report_library_index_2026_10_30.run']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pypdf
      - run: python -m scripts.cache_periodic_media --period 2026-10
      - run: python -m scripts.build_periodic_report --period monthly --end 2026-10-30
      - name: Audit actual PDF pages, sections, links and images
        run: python -m scripts.qa_periodic_pdf --period monthly
      - run: |
          python scripts/update_report_index.py
          python scripts/build_website.py
          node --check website/app.js
          python - <<'PY'
          import json
          from pathlib import Path
          entry=json.loads(Path('reports/monthly-latest.json').read_text())
          assert (Path('_site')/entry['path']).exists(), 'Published website PDF missing'
          index=json.loads(Path('_site/reports-index.json').read_text())
          assert any(row['path']==entry['path'] for row in index), 'Monthly PDF missing from UI index'
          app=Path('_site/app.js').read_text()
          assert 'item.path' in app and 'pdf-frame' in app, 'Embedded local preview missing'
          print('Website PDF preview, local file and report index passed')
          PY
      - name: Verify all three categories exist
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          items=json.loads(Path('reports-index.json').read_text())
          types={x.get('type') for x in items}
          assert {'daily','weekly','monthly'}<=types,types
          assert all(x.get('path') and x.get('date') for x in items)
          print('Published index categories:',types)
          PY
      - name: Validate production Vercel build including monthly in-site PDF viewer
        run: |
          node scripts/build_website.mjs
          node --check website/app.js
          node --input-type=module - <<'JS'
          import {readFileSync,existsSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const manifest=JSON.parse(readFileSync('_site/reports-index.json','utf8'));
          const kinds=new Set(manifest.map(x=>x.type));
          assert(kinds.has('daily')&&kinds.has('weekly')&&kinds.has('monthly'), 'Production website lost one or more frequencies');
          for(const m of manifest){
            assert(existsSync('_site/'+m.path), 'Missing public PDF '+m.path);
          }
          const monthly=manifest.find(x=>x.type==='monthly'&&x.date==='2026-10-30');
          assert(monthly, 'October monthly PDF missing from production UI');
          const ui=readFileSync('_site/app.js','utf8');
          assert(ui.includes('new URL(item.path'), 'Production site not using embedded same-origin PDF');
          console.log('VERCEL_UI_QA_PASS',JSON.stringify({types:[...kinds],monthly:monthly.path,count:manifest.length}));
          JS
      - name: Commit live report library manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports-index.json reports/ data/reference_*.json assets/
          git diff --cached --quiet || (git commit -m 'Publish three-frequency report library index' && git pull --rebase origin main && git push origin main)
