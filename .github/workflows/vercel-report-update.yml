name: Angelbird Vercel Update After Report Publish
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'reports-index.json'
      - 'website/**'
      - 'scripts/build_website.mjs'
      - '.github/workflows/vercel-report-update.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel redeploy if hook is configured
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::Vercel deploy hook is not configured. Ensure the Vercel project is linked to the main GitHub branch, or add VERCEL_DEPLOY_HOOK under Actions Secrets."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 3 \
            --request POST "$VERCEL_DEPLOY_HOOK"
          echo "Vercel rebuild requested; verify completion in the Vercel Deployments dashboard."
