name: Atomos Vercel Update After Report Publish
on:
  push:
    branches: [main]
    paths:
      - 'reports/**'
      - 'reports-index.json'
      - 'website/**'
      - 'scripts/build_website.mjs'
      - '.github/workflows/vercel-report-update.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Atomos Vercel build when deployment hook configured
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::Vercel hook not configured. Link the new Atomos repository to its own Vercel project or set VERCEL_DEPLOY_HOOK."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 2 --request POST "$VERCEL_DEPLOY_HOOK"
