name: Angelbird Vercel Manual Publication
# Angelbird GitHub research/PDF commits should not deploy Vercel.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Manually publish website through configured Vercel hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        shell: bash
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::error::VERCEL_DEPLOY_HOOK is missing; manual deployment cannot start."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --retry 2 --request POST "$VERCEL_DEPLOY_HOOK"
