name: Angelbird Python Actual Sources - 30 Oct
on:
  push:
    branches: [main]
    paths:
      - 'config/python_sources_2026_10_30.run'
permissions:
  contents: write
concurrency:
  group: angelbird-report-main
  cancel-in-progress: false
jobs:
  actual-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RESEARCH_ENGINE: python
      REPORT_DATE: '2026-10-30'
      DRY_RUN: 'false'
      REPORT_ONLY: 'false'
      MAX_SEARCH_QUERIES: '18'
      MAX_SOURCE_PAGES: '35'
      MAX_SOURCE_IMAGES: '12'
      MAX_HISTORICAL_IMAGES: '5'
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify collector and PDF regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect actual web sources, original posts, comments and images
        run: python -m src.main
      - name: Commit actual 30 October PDF with 25-29 October history
        run: |
          git config user.name 'angelbird-report-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ data/ assets/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'Angelbird 30 Oct Python original-source research PDF'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
      - name: Save complete source audit and report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelbird-python-real-30-oct
          path: |
            data/2026/10/
            reports/2026/10/
            assets/2026/10/
          if-no-files-found: ignore
