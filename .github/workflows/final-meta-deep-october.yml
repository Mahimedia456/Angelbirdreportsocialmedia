name: Angelbird October Deep Meta and Cross-Platform Final Research
on:
  push:
    branches: [main]
    paths: ['config/final_meta_deep_october_2026.run']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: angelbird-final-october-meta-research
  cancel-in-progress: false
jobs:
  deep-research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RESEARCH_ENGINE: python
      FREE_SOURCES_ONLY: 'false'
      GPT_RESEARCH_ENABLED: 'true'
      GPT_PLATFORM_SWEEPS: 'true'
      GPT_FORCE_RESEARCH: 'true'
      GPT_MAX_RESEARCH_ROUNDS: '3'
      GPT_MAX_WEB_CALLS: '3'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENAI_MODEL: gpt-4.1-mini
      MAX_SEARCH_QUERIES: '92'
      MAX_SOURCE_PAGES: '120'
      MAX_SOURCE_PAGES_PER_GROUP: '16'
      MAX_SOURCE_IMAGES: '24'
      MAX_REPORT_IMAGES: '24'
      REPORT_SINGLE_DAY: 'true'
      REPORT_PREVIOUS_COMPLETED_DAY: 'false'
      DRY_RUN: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pypdf
      - name: Search fresh historical dates with Python and OpenAI Meta sweeps
        shell: bash
        run: |
          set -e
          for day in 2026-10-03 2026-10-10 2026-10-17 2026-10-24; do
            echo "HISTORICAL_DATE=$day | original source proof required"
            REPORT_DATE="$day" python -m src.main
          done
      - name: Cache attributed public source images
        run: python -m scripts.cache_periodic_media --period 2026-10
      - name: Build no-page-cap professional monthly PDF
        run: python -m scripts.build_periodic_report --period monthly --end 2026-10-30
      - name: Strict monthly PDF source link and image QA
        run: python -m scripts.qa_periodic_pdf --period monthly
      - name: Publish full PDF and same-origin website archive
        run: |
          python scripts/update_report_index.py
          python scripts/build_website.py
          node scripts/build_website.mjs
          node --check website/app.js
          python - <<'PY'
          from pathlib import Path
          import json
          meta=json.loads(Path('reports/monthly-latest.json').read_text())
          quality=json.loads(Path('reports/monthly-quality-audit.json').read_text())
          assert Path('_site',meta['path']).is_file()
          assert quality['pages']>0
          print('FINAL_DEEP_OCTOBER',json.dumps({'dated':meta['dated_findings'],'leads':meta['unverified_leads'],'pages':quality['pages'],'media':quality['embedded_pdf_image_xobjects']},sort_keys=True))
          PY
      - name: Commit dated source JSON images PDF and UI manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ assets/ reports/ reports-index.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Angelbird verified historical Meta and social research, final professional October PDF'
            git pull --rebase origin main
            git push origin main
          fi
