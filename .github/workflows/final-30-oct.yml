name: Final Angelbird 30 October Real Report
on:
  push:
    branches: [main]
    paths:
      - 'config/final_2026_10_30.run'
permissions:
  contents: write
concurrency:
  group: angelbird-report-main
  cancel-in-progress: false
jobs:
  final-real-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: 'gpt-4.1-mini'
      REPORT_DATE: '2026-10-30'
      DRY_RUN: 'false'
      REPORT_ONLY: 'false'
      FORCE_RESEARCH: 'true'
      MAX_WEB_CALLS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install report dependencies
        run: pip install -r requirements.txt
      - name: Actual dated research and latest-plus-five PDF generation
        run: python -m src.main
      - name: Commit actual 30 October evidence and PDF
        run: |
          git config user.name 'angelbird-report-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ reports/
          if ! git diff --cached --quiet; then
            git commit -m 'Final actual Angelbird 30 October report with five previous days'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "${GITHUB_REF_NAME}"
          fi
      - name: Preserve research diagnostics and PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angelbird-30-oct-final-research
          path: |
            data/2026/10/
            reports/2026/10/
          if-no-files-found: ignore
